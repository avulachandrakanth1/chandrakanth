<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lm-accent" x1="60" y1="40" x2="140" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5eead4" />
      <stop offset="1" stop-color="#2dd4bf" />
    </linearGradient>
    <linearGradient id="lm-scan" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#5eead4" stop-opacity="0" />
      <stop offset="0.5" stop-color="#5eead4" stop-opacity="0.9" />
      <stop offset="1" stop-color="#5eead4" stop-opacity="0" />
    </linearGradient>
    <clipPath id="lm-screen"><rect x="76" y="64" width="48" height="48" rx="6" /></clipPath>
    <style>
      @keyframes lm-scan { 0%,100% { transform: translateY(0); } 50% { transform: translateY(40px); } }
      @keyframes lm-twinkle { 0%,100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.18); opacity: 1; } }
      @keyframes lm-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
      .lm-phone { animation: lm-float 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .lm-scanline { animation: lm-scan 2.6s ease-in-out infinite; }
      .lm-star { animation: lm-twinkle 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @media (prefers-reduced-motion: reduce) { .lm-phone,.lm-scanline,.lm-star { animation: none; } }
    </style>
  </defs>
  <g class="lm-phone">
    <g stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.92">
      <rect x="62" y="34" width="76" height="132" rx="14" />
      <line x1="88" y1="48" x2="112" y2="48" />
      <rect x="76" y="64" width="48" height="48" rx="6" stroke="url(#lm-accent)" />
    </g>
    <g fill="url(#lm-accent)">
      <rect x="83" y="71" width="9" height="9" rx="1.5" />
      <rect x="108" y="71" width="9" height="9" rx="1.5" />
      <rect x="83" y="96" width="9" height="9" rx="1.5" />
      <rect x="99" y="87" width="6" height="6" rx="1" />
      <rect x="108" y="96" width="9" height="9" rx="1" />
    </g>
    <g clip-path="url(#lm-screen)">
      <rect class="lm-scanline" x="76" y="62" width="48" height="6" fill="url(#lm-scan)" />
    </g>
    <path class="lm-star" d="M100 124l5.4 10.9 12 1.7-8.7 8.5 2 12-10.7-5.6-10.7 5.6 2-12-8.7-8.5 12-1.7z" fill="url(#lm-accent)" fill-opacity="0.85" />
  </g>
</svg>
