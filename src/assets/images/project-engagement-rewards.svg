<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="er-accent" x1="50" y1="40" x2="150" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5eead4" />
      <stop offset="1" stop-color="#2dd4bf" />
    </linearGradient>
    <style>
      @keyframes er-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
      @keyframes er-pulse { 0%,100% { transform: scale(1); opacity: 0.85; } 50% { transform: scale(1.25); opacity: 1; } }
      @keyframes er-dash { to { stroke-dashoffset: -24; } }
      .er-phone { animation: er-float 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .er-node { transform-box: fill-box; transform-origin: center; animation: er-pulse 2.4s ease-in-out infinite; }
      .er-node2 { animation-delay: 0.5s; }
      .er-node3 { animation-delay: 1s; }
      .er-link { stroke-dasharray: 5 7; animation: er-dash 1.2s linear infinite; }
      @media (prefers-reduced-motion: reduce) { .er-phone,.er-node,.er-link { animation: none; } }
    </style>
  </defs>
  <g stroke="url(#er-accent)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7">
    <path class="er-link" d="M118 70l16-6" />
    <path class="er-link" d="M118 104l28 4" />
    <path class="er-link" d="M118 130l10 8" />
  </g>
  <g class="er-phone">
    <g stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.92">
      <rect x="58" y="40" width="60" height="120" rx="13" />
      <line x1="80" y1="52" x2="96" y2="52" />
    </g>
    <g stroke="url(#er-accent)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="72" y="78" width="12" height="12" rx="2" fill="url(#er-accent)" fill-opacity="0.2" />
      <rect x="92" y="78" width="12" height="12" rx="2" fill="url(#er-accent)" fill-opacity="0.2" />
      <path d="M72 102h32" />
      <path d="M72 114h22" />
    </g>
  </g>
  <g fill="url(#er-accent)">
    <circle class="er-node" cx="138" cy="62" r="9" fill-opacity="0.85" />
    <circle class="er-node er-node2" cx="150" cy="110" r="9" fill-opacity="0.85" />
    <circle class="er-node er-node3" cx="128" cy="142" r="9" fill-opacity="0.85" />
  </g>
</svg>
