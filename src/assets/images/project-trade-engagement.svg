<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="te-accent" x1="40" y1="50" x2="160" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5eead4" />
      <stop offset="1" stop-color="#2dd4bf" />
    </linearGradient>
    <style>
      @keyframes te-grow { 0%,8% { transform: scaleY(0.12); } 45%,100% { transform: scaleY(1); } }
      @keyframes te-draw { to { stroke-dashoffset: 0; } }
      @keyframes te-arrow { 0%,40% { opacity: 0; transform: scale(0.6); } 60%,100% { opacity: 1; transform: scale(1); } }
      @keyframes te-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
      .te-card { animation: te-float 5.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .te-bar { transform-box: fill-box; transform-origin: bottom; animation: te-grow 4s ease-in-out infinite; }
      .te-bar2 { animation-delay: 0.18s; }
      .te-bar3 { animation-delay: 0.36s; }
      .te-line { stroke-dasharray: 150; stroke-dashoffset: 150; animation: te-draw 4s ease-in-out infinite; }
      .te-arrow { transform-box: fill-box; transform-origin: center; animation: te-arrow 4s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .te-card,.te-bar,.te-line,.te-arrow { animation: none; } .te-line { stroke-dashoffset: 0; } .te-arrow { opacity: 1; } }
    </style>
  </defs>
  <g class="te-card">
    <g stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.92">
      <rect x="36" y="44" width="128" height="92" rx="12" />
      <line x1="36" y1="148" x2="164" y2="148" />
      <line x1="80" y1="148" x2="80" y2="160" />
      <line x1="120" y1="148" x2="120" y2="160" />
      <line x1="66" y1="160" x2="134" y2="160" />
    </g>
    <g stroke="url(#te-accent)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <rect class="te-bar" x="56" y="98" width="14" height="22" rx="2" fill="url(#te-accent)" fill-opacity="0.22" />
      <rect class="te-bar te-bar2" x="82" y="82" width="14" height="38" rx="2" fill="url(#te-accent)" fill-opacity="0.22" />
      <rect class="te-bar te-bar3" x="108" y="68" width="14" height="52" rx="2" fill="url(#te-accent)" fill-opacity="0.22" />
      <path class="te-line" d="M58 92l24-18 22 10 22-24" fill="none" />
      <path class="te-arrow" d="M118 56h12v12" fill="none" />
    </g>
  </g>
</svg>
