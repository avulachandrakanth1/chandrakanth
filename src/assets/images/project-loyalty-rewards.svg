<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lr-accent" x1="50" y1="50" x2="150" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5eead4" />
      <stop offset="1" stop-color="#2dd4bf" />
    </linearGradient>
    <style>
      @keyframes lr-bob { 0%,100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-7px) rotate(6deg); } }
      @keyframes lr-spark { 0%,100% { opacity: 0.2; transform: scale(0.7); } 50% { opacity: 1; transform: scale(1.1); } }
      @keyframes lr-lidpop { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
      .lr-box { animation: lr-lidpop 4.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .lr-star { animation: lr-bob 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .lr-spark { transform-box: fill-box; transform-origin: center; animation: lr-spark 2.4s ease-in-out infinite; }
      .lr-spark2 { animation-delay: 0.5s; }
      .lr-spark3 { animation-delay: 1s; }
      @media (prefers-reduced-motion: reduce) { .lr-box,.lr-star,.lr-spark { animation: none; } }
    </style>
  </defs>
  <g class="lr-box">
    <g stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.92">
      <rect x="52" y="96" width="96" height="64" rx="8" />
      <line x1="100" y1="96" x2="100" y2="160" />
      <rect x="46" y="78" width="108" height="22" rx="6" />
    </g>
    <g stroke="url(#lr-accent)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M100 78c-6-18-18-26-27-22-8 4-7 16 4 22" fill="url(#lr-accent)" fill-opacity="0.18" />
      <path d="M100 78c6-18 18-26 27-22 8 4 7 16-4 22" fill="url(#lr-accent)" fill-opacity="0.18" />
    </g>
  </g>
  <path class="lr-star" d="M124 108l5 10.2 11.2 1.6-8.1 7.9 1.9 11.2-10-5.3-10 5.3 1.9-11.2-8.1-7.9 11.2-1.6z" fill="url(#lr-accent)" fill-opacity="0.9" />
  <g fill="#5eead4">
    <circle class="lr-spark" cx="62" cy="66" r="3.5" />
    <circle class="lr-spark lr-spark2" cx="150" cy="84" r="3" />
    <circle class="lr-spark lr-spark3" cx="70" cy="120" r="2.6" />
  </g>
</svg>
