<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 608" width="100%" height="100%" fill="none" role="img" aria-label="Mobile and frontend developer building cross-platform apps with React Native, Angular, React, and Ionic">
  <defs>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111a22"/>
      <stop offset="100%" stop-color="#0a0e13"/>
    </linearGradient>
    <linearGradient id="heroBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="appHeader" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#155e75"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="screenClip">
      <rect x="-86" y="-188" width="172" height="376" rx="26"/>
    </clipPath>
  </defs>

  <!-- Ambient glow (transparent background) -->
  <ellipse cx="450" cy="300" rx="300" ry="260" fill="url(#glow)"/>

  <!-- Orbit guide rings -->
  <ellipse cx="450" cy="300" rx="300" ry="210" stroke="#2dd4bf" stroke-opacity="0.14" stroke-width="1.5" stroke-dasharray="4 8"/>
  <ellipse cx="450" cy="300" rx="220" ry="150" stroke="#2dd4bf" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="4 8"/>

  <!-- ============ PHONE (center) ============ -->
  <g transform="translate(450 300)">
    <!-- soft drop shadow -->
    <rect x="-98" y="-196" width="196" height="404" rx="38" fill="#2dd4bf" opacity="0.10" transform="translate(6 14)"/>

    <!-- device frame -->
    <rect x="-98" y="-200" width="196" height="404" rx="38" fill="url(#frameGrad)"/>
    <rect x="-92" y="-194" width="184" height="392" rx="32" fill="#0d0b14"/>

    <!-- screen -->
    <g clip-path="url(#screenClip)">
      <rect x="-86" y="-188" width="172" height="376" fill="url(#screenGrad)"/>

      <!-- status bar -->
      <text x="-72" y="-168" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#e4e4f0">9:41</text>
      <circle cx="62" cy="-172" r="2.4" fill="#a1a1aa"/>
      <circle cx="70" cy="-172" r="2.4" fill="#a1a1aa"/>
      <rect x="76" y="-175" width="8" height="6" rx="1.4" fill="#a1a1aa"/>

      <!-- app header card -->
      <rect x="-74" y="-150" width="148" height="74" rx="16" fill="url(#appHeader)"/>
      <circle cx="-50" cy="-122" r="14" fill="#ffffff" opacity="0.92"/>
      <path d="M-56 -116 q6 -10 12 0" stroke="#0f766e" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="-50" cy="-126" r="4.5" fill="#0f766e"/>
      <rect x="-28" y="-130" width="70" height="8" rx="4" fill="#ffffff" opacity="0.92"/>
      <rect x="-28" y="-116" width="48" height="6" rx="3" fill="#ffffff" opacity="0.6"/>

      <!-- list cards -->
      <g>
        <rect x="-74" y="-62" width="148" height="40" rx="12" fill="#ffffff" opacity="0.06"/>
        <rect x="-66" y="-52" width="22" height="22" rx="7" fill="url(#heroBar)"/>
        <rect x="-38" y="-52" width="74" height="7" rx="3.5" fill="#d4d4e0" opacity="0.85"/>
        <rect x="-38" y="-40" width="50" height="6" rx="3" fill="#a1a1aa" opacity="0.7"/>

        <rect x="-74" y="-14" width="148" height="40" rx="12" fill="#ffffff" opacity="0.06"/>
        <rect x="-66" y="-4" width="22" height="22" rx="7" fill="#61dafb" opacity="0.85"/>
        <rect x="-38" y="-4" width="84" height="7" rx="3.5" fill="#d4d4e0" opacity="0.85"/>
        <rect x="-38" y="8" width="40" height="6" rx="3" fill="#a1a1aa" opacity="0.7"/>

        <rect x="-74" y="34" width="148" height="40" rx="12" fill="#ffffff" opacity="0.06"/>
        <rect x="-66" y="44" width="22" height="22" rx="7" fill="#3880ff" opacity="0.85"/>
        <rect x="-38" y="44" width="64" height="7" rx="3.5" fill="#d4d4e0" opacity="0.85"/>
        <rect x="-38" y="56" width="56" height="6" rx="3" fill="#a1a1aa" opacity="0.7"/>
      </g>

      <!-- floating action button -->
      <circle cx="58" cy="118" r="20" fill="url(#heroBar)" filter="url(#softGlow)"/>
      <path d="M58 110 v16 M50 118 h16" stroke="#fff" stroke-width="3" stroke-linecap="round"/>

      <!-- bottom tab bar -->
      <rect x="-86" y="148" width="172" height="40" fill="#0f0c18"/>
      <g fill="#2dd4bf">
        <rect x="-66" y="160" width="18" height="14" rx="3"/>
      </g>
      <circle cx="-18" cy="167" r="7" fill="#52525b"/>
      <rect x="14" y="160" width="14" height="14" rx="3" fill="#52525b"/>
      <circle cx="56" cy="167" r="7" fill="#52525b"/>
    </g>

    <!-- notch -->
    <rect x="-26" y="-194" width="52" height="14" rx="7" fill="#0d0b14"/>
  </g>

  <!-- ============ TECH PILLS ============ -->
  <!-- Angular -->
  <g transform="translate(96 120)" filter="url(#softGlow)">
    <rect width="128" height="44" rx="22" fill="#131a22" stroke="#dd0031" stroke-opacity="0.55" stroke-width="1.5"/>
    <circle cx="24" cy="22" r="7" fill="#dd0031"/>
    <text x="42" y="28" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#f4f4f5">Angular</text>
  </g>

  <!-- React -->
  <g transform="translate(666 104)" filter="url(#softGlow)">
    <rect width="116" height="44" rx="22" fill="#131a22" stroke="#61dafb" stroke-opacity="0.55" stroke-width="1.5"/>
    <circle cx="24" cy="22" r="7" fill="#61dafb"/>
    <text x="42" y="28" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#f4f4f5">React</text>
  </g>

  <!-- Ionic -->
  <g transform="translate(66 244)" filter="url(#softGlow)">
    <rect width="112" height="44" rx="22" fill="#131a22" stroke="#3880ff" stroke-opacity="0.55" stroke-width="1.5"/>
    <circle cx="24" cy="22" r="7" fill="#3880ff"/>
    <text x="42" y="28" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#f4f4f5">Ionic</text>
  </g>

  <!-- React Native -->
  <g transform="translate(636 232)" filter="url(#softGlow)">
    <rect width="168" height="44" rx="22" fill="#131a22" stroke="#149eca" stroke-opacity="0.6" stroke-width="1.5"/>
    <circle cx="24" cy="22" r="7" fill="#149eca"/>
    <text x="42" y="28" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#f4f4f5">React Native</text>
  </g>

  <!-- RxJS -->
  <g transform="translate(84 378)" filter="url(#softGlow)">
    <rect width="110" height="44" rx="22" fill="#131a22" stroke="#0ea5e9" stroke-opacity="0.55" stroke-width="1.5"/>
    <circle cx="24" cy="22" r="7" fill="#0ea5e9"/>
    <text x="42" y="28" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#f4f4f5">RxJS</text>
  </g>

  <!-- NgRx -->
  <g transform="translate(672 366)" filter="url(#softGlow)">
    <rect width="114" height="44" rx="22" fill="#131a22" stroke="#3b82f6" stroke-opacity="0.55" stroke-width="1.5"/>
    <circle cx="24" cy="22" r="7" fill="#3b82f6"/>
    <text x="42" y="28" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#f4f4f5">NgRx</text>
  </g>

  <!-- Redux -->
  <g transform="translate(132 482)" filter="url(#softGlow)">
    <rect width="120" height="44" rx="22" fill="#131a22" stroke="#64748b" stroke-opacity="0.6" stroke-width="1.5"/>
    <circle cx="24" cy="22" r="7" fill="#64748b"/>
    <text x="42" y="28" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#f4f4f5">Redux</text>
  </g>

  <!-- Redux Toolkit -->
  <g transform="translate(602 470)" filter="url(#softGlow)">
    <rect width="176" height="44" rx="22" fill="#131a22" stroke="#14b8a6" stroke-opacity="0.6" stroke-width="1.5"/>
    <circle cx="24" cy="22" r="7" fill="#14b8a6"/>
    <text x="42" y="28" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#f4f4f5">Redux Toolkit</text>
  </g>

  <!-- decorative particles -->
  <circle cx="250" cy="90" r="3" fill="#2dd4bf" opacity="0.5"/>
  <circle cx="640" cy="540" r="3" fill="#0d9488" opacity="0.5"/>
  <circle cx="300" cy="540" r="2.5" fill="#5eead4" opacity="0.5"/>
  <circle cx="620" cy="70" r="2.5" fill="#5eead4" opacity="0.5"/>
</svg>
